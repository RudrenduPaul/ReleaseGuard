name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Update npm for Trusted Publishing
        run: npm install -g npm@11

      - name: Sanity-check the npm launcher's not-found message
        working-directory: npm-shim
        run: |
          set +e
          output=$(node bin/releaseguard-cli.js --help 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep -q "was not found on your PATH"

      - name: Publish npm-shim
        working-directory: npm-shim
        run: npm publish --provenance --access public

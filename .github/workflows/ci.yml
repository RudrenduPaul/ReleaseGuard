name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (base + dev + mcp)
        run: pip install -e ".[dev,mcp]"

      # Presidio's AnalyzerEngine needs a spaCy language model, which is
      # not a pip dependency (spaCy models ship as their own installable
      # packages via `spacy download`, not `pip install`). Needed for the
      # `integration` tests in test_presidio_detector.py and test_mcp_server.py.
      - name: Download the spaCy model integration tests need
        run: python -m spacy download en_core_web_sm

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src/releaseguard

      - name: Test + coverage (includes real-Presidio integration tests)
        run: pytest --cov=releaseguard --cov-report=term-missing --cov-fail-under=80

      - name: Build sdist/wheel
        run: |
          pip install build
          python -m build

  npm-shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Sanity-check the npm launcher's not-found message
        working-directory: npm-shim
        run: |
          set +e
          output=$(node bin/releaseguard-cli.js --help 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep -q "was not found on your PATH"
